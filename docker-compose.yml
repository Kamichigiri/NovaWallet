services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "yourStrongPassword123!"
    ports:
      - "1401:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'yourStrongPassword123!' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - novawallet_mssql:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: NovaWallet.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__NovaWalletDb: "Server=db,1433;Database=novawallet;User Id=sa;Password=yourStrongPassword123!;TrustServerCertificate=True"
      Jwt__Issuer: NovaWallet.Dev
      Jwt__Audience: NovaWallet.Api
      Jwt__SigningKey: dev-only-signing-key-change-me-to-a-long-random-secret-123456
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  novawallet_mssql:
